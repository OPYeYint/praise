$kind: http-request
name: Rejected Google token
method: POST
url: '{{baseUrl}}/api/auth/google'
order: 2000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "idToken": "not-a-real-google-token"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 401", function () {
          pm.response.to.have.status(401);
      });
examples: './.resources/rejected-google-token.resources/examples'
