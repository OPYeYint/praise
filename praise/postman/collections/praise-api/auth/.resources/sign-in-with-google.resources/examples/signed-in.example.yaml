$kind: http-example
name: Signed in
order: 1000
request:
  url: '{{baseUrl}}/api/auth/google'
  method: POST
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "token": "eyJhbGciOiJIUzI1NiJ9.example.signature",
        "tokenType": "Bearer",
        "expiresAt": "2026-10-29T06:00:00Z",
        "user": {
          "id": 1,
          "email": "ada@example.com",
          "displayName": "Ada"
        }
      }
