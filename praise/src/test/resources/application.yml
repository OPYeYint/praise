spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:praise;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  jwt:
    secret: "test-jwt-secret-must-be-32-bytes-min"
    expiration: 12h
