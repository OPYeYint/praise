spring:
  application:
    name: praise
  config:
    import:
      - optional:file:./application-local.yml
      - optional:file:./praise/application-local.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/praise
    username: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
server:
  port: 8082
  error:
    include-stacktrace: never
app:
  jwt:
    expiration: 12h
